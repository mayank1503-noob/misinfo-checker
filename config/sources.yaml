# Source credibility tiers.
#
# Every retrieved item is weighted by the domain it came from, and that
# weight multiplies its stance when the verdict adds support and refutation
# up (see backend/graph/store.py: stance_totals). The tiers are coarse on
# purpose — this is "how much benefit of the doubt does this domain get",
# not a precision instrument, and a transparent table beats a tuned number
# nobody can argue with.
#
# Matching is on the registered domain, with `www.` stripped, and a
# subdomain inherits its parent's tier (factcheck.pib.gov.in -> pib.gov.in)
# unless it is listed in its own right.

tiers:
  factchecker: 1.0   # IFCN signatories and PIB Fact Check
  government: 0.9    # official ministries, regulators, statutory bodies
  news: 0.8          # established newsrooms with corrections policies
  other: 0.5         # anything unrecognised — the default
  blog: 0.3          # blogs, forums, social platforms, content farms

default_tier: other

# Fact-checkers whose published rating is treated as decisive when it
# matches a claim closely (see backend/evidence/normalize.py).
domains:
